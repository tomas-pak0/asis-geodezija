name: Android packages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bundle DWG reader for offline APK import
        run: |
          curl -fLS --retry 3 --max-time 120 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.7.14/wasm/libredwg-web.wasm' -o ../public/vendor/libredwg/wasm/libredwg-web.wasm
          echo '431576487027122a28e5ac99d91fe6366f81ecda743a4676878c75c85fe82c53  ../public/vendor/libredwg/wasm/libredwg-web.wasm' | sha256sum -c -
      - name: Build debug APK and unsigned release bundle
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: asis-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: asis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asis-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: |
            adb install apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n lt.tyliaitpk.asis/.MainActivity
            sleep 10
            adb logcat -d -v brief > crash-log.txt
            adb shell pidof lt.tyliaitpk.asis || { grep -m 1 -A 45 -B 6 'FATAL EXCEPTION' crash-log.txt || grep -E 'lt.tyliaitpk.asis|AndroidRuntime|am_crash|am_kill' crash-log.txt | tail -70; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-log
          path: crash-log.txt
